buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.liquibase:liquibase-core:5.0.4'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.liquibase.gradle' version '3.1.1'
}

group = 'fi.bizhop'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

// Optional PostgreSQL tests (src/dbTest), run only with ./gradlew dbTest. Not part of check/build.
sourceSets {
    dbTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    dbTestImplementation.extendsFrom implementation
    dbTestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    implementation 'com.google.api-client:google-api-client:2.8.1'
    implementation 'com.google.http-client:google-http-client-gson:1.47.0'

    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'commons-io:commons-io:2.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    dbTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    dbTestImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    dbTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    liquibaseRuntime 'org.liquibase:liquibase-core'
    liquibaseRuntime 'org.postgresql:postgresql'
    liquibaseRuntime 'info.picocli:picocli:4.7.7'
}

liquibase {
    def setting = { String propertyName, String environmentName, String defaultValue ->
        project.findProperty(propertyName) ?: System.getenv(environmentName) ?: defaultValue
    }
    activities {
        main {
            arguments = [
                url: setting('liquibaseUrl', 'KIRVES_LIQUIBASE_URL', 'jdbc:postgresql://localhost:5432/kirves'),
                username: setting('liquibaseUsername', 'KIRVES_LIQUIBASE_USERNAME', 'kirves'),
                password: setting('liquibasePassword', 'KIRVES_LIQUIBASE_PASSWORD', 'kirves'),
                changelogFile: 'src/main/resources/db/db.changelog.xml'
            ]
        }
    }
    runList = 'main'
}

tasks.test {
    useJUnitPlatform()
}

tasks.register('dbTest', Test) {
    description = 'Runs the PostgreSQL tests against a running database (see README).'
    group = 'verification'
    testClassesDirs = sourceSets.dbTest.output.classesDirs
    classpath = sourceSets.dbTest.runtimeClasspath
    useJUnitPlatform()
    // the database is external state, never consider the results up to date
    outputs.upToDateWhen { false }
    ['KIRVES_DBTEST_URL', 'KIRVES_DBTEST_USERNAME', 'KIRVES_DBTEST_PASSWORD'].each { name ->
        def value = project.findProperty(name) ?: System.getenv(name)
        if (value) systemProperty name, value
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

tasks.jar {
    enabled = false
}

tasks.bootJar {
    archiveFileName = 'kirvespeli-1.0.0.jar'
}
